  { name:"GitHub Models", vendor:"GitHub", region:"intl", kind:"none", amt:"已停止服务（2026-07-30 全量下线）", gate:"", conf:"high",
    url:"https://github.com/marketplace/models",
    src:"https://docs.github.com/en/github-models/use-github-models/prototyping-with-ai-models",
    note:"官方指引迁移至 Azure AI Foundry 或 GitHub Copilot。" },
  { name:"NVIDIA NIM（build.nvidia.com）", vendor:"NVIDIA", region:"intl", kind:"onetime", amt:"40 RPM / 10,000 RPD（按模型计）", gate:"需加入 NVIDIA Developer Program", conf:"medium",
    url:"https://build.nvidia.com",
    src:"https://build.nvidia.com",
    note:"定位为开发者试用；数字来自社区维护清单与 NVIDIA 官方开发者论坛 FAQ。" },
  { name:"Together AI", vendor:"Together AI", region:"intl", kind:"none", amt:"无免费额度 · 需最低充值 $5", gate:"", conf:"high",
    url:"https://docs.together.ai/docs/billing-credits",
    src:"https://docs.together.ai/docs/billing-credits",
    note:"2025 年由 $25 赠送降至 $1，2026 年官方文档确认不再提供免费试用。" },
  { name:"Cloudflare Workers AI", vendor:"Cloudflare", region:"intl", kind:"daily", amt:"10,000 Neurons（UTC 0 点重置）", gate:"部分模型（特定 Kimi / GLM / DeepSeek 变体）需绑卡", conf:"high",
    url:"https://developers.cloudflare.com/workers-ai/platform/pricing/",
    src:"https://developers.cloudflare.com/workers-ai/platform/pricing/",
    note:"超出后免费计划直接报错，付费计划按 $0.011 / 千 Neurons 计费。" },
  { name:"Perplexity 免费版", vendor:"Perplexity", region:"intl", kind:"daily", amt:"约 5 次 Pro 搜索（快速搜索不限）", gate:"", conf:"medium",
    url:"https://www.perplexity.ai",
    src:"https://www.perplexity.ai/",
    note:"官方定价页称免费版「随时间调整」，不承诺固定数字。" },
  { name:"Poe 免费账户", vendor:"Poe（Quora）", region:"intl", kind:"daily", amt:"约 300 积分（当日有效不结转）", gate:"", conf:"low",
    url:"https://poe.com",
    src:"https://help.poe.com/hc/en-us/articles/19944206309524-Poe-FAQs",
    note:"官方仅确认每日发放积分、不公布固定数字；第三方口径 300 ～ 10,000 积分/日冲突，消耗因模型而异。" }
];

const KIND_LABEL = { free:"免费不限", daily:"每日", monthly:"每月", onetime:"一次性", none:"无免费" };
const KIND_CLASS = { free:"k-free", daily:"k-daily", monthly:"k-monthly", onetime:"k-onetime", none:"k-none" };
const rowsEl = document.getElementById("rows");
const countEl = document.getElementById("count");
const qEl = document.getElementById("q");
const clearBtn = document.getElementById("clearBtn");
const srcListEl = document.getElementById("srcList");
let filter = "all";

function domain(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } }
function cat(d) {
  if (d.kind === "none") return "none";
  return d.gate ? "gate" : "free";
}
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function render() {
  const kw = qEl.value.trim().toLowerCase();
  let shown = 0;
  const html = DATA.map(function (d) {
    const c = cat(d);
    if (filter !== "all" && filter !== c) return "";
    const hay = (d.name + " " + d.vendor + " " + d.url + " " + d.amt).toLowerCase();
    if (kw && hay.indexOf(kw) === -1) return "";
    shown++;
    const gateCell = d.gate
      ? '<span class="gate-pill">' + esc(d.gate) + '</span>'
      : '<span class="gate-none">—</span>';
    const verify = d.conf === "low" ? '<span class="badge-verify">待核实</span>' : "";
    return '<tr>' +
      '<td><div class="m-name">' + esc(d.name) + '</div>' +
      '<div class="m-vendor">' + esc(d.vendor) +
      '<span class="region ' + d.region + '">' + (d.region === "cn" ? "中国" : "国际") + '</span></div></td>' +
      '<td><span class="pill ' + KIND_CLASS[d.kind] + '">' + KIND_LABEL[d.kind] + '</span>' + verify +
      '<div class="q-text">' + esc(d.amt) + '</div></td>' +
      '<td>' + gateCell + '</td>' +
      '<td><a href="' + d.url + '" target="_blank" rel="noopener">' + esc(domain(d.url)) + ' ↗</a></td>' +
      '</tr>';
  }).join("");
  rowsEl.innerHTML = shown
    ? html
    : '<tr><td colspan="4" class="empty">没有匹配的结果，换个关键词试试</td></tr>';
  countEl.textContent = "共 " + DATA.length + " 条 · 显示 " + shown + " 条";
}

qEl.addEventListener("input", function () {
  clearBtn.classList.toggle("show", !!qEl.value);
  render();
});
clearBtn.addEventListener("click", function () {
  qEl.value = ""; clearBtn.classList.remove("show"); render(); qEl.focus();
});
document.querySelectorAll(".chip").forEach(function (chip) {
  chip.addEventListener("click", function () {
    document.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("on"); });
    chip.classList.add("on");
    filter = chip.getAttribute("data-f");
    render();
  });
});

// 底部来源列表
srcListEl.innerHTML = DATA.map(function (d) {
  return '<li><b>' + esc(d.name) + '</b>（' + esc(d.vendor) + '，置信度 ' +
    ({high:"高", medium:"中", low:"低"})[d.conf] + '）：' +
    '<a href="' + d.src + '" target="_blank" rel="noopener">来源</a> · ' +
    '<a href="' + d.url + '" target="_blank" rel="noopener">官网</a> —— ' + esc(d.note) + '</li>';
}).join("");

render();
</script>
</body>
</html>
